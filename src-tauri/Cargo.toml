[package]
name = "codebridge"
version = "0.2.0"
description = "CodeBridge Visual Arduino IDE"
authors = ["simfonia"]
edition = "2021"

[lib]
name = "codebridge_lib"
path = "src/lib.rs"

[[bin]]
name = "codebridge"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serialport = "4.2"
# 子進程輸出的寬容解碼（Windows cp950 / Big5 亂碼根治），見 src/arduino/encoding.rs
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
open = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
