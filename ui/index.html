<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBridge: Visual Arduino Programming</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Highlight.js 語法高亮 (本地化) -->
    <link rel="stylesheet" href="/src/vs.min.css">
    <script src="src/highlight.min.js"></script>
    <script src="src/arduino.min.js"></script>
    
    <!-- 樣式表 (Vite 會處理) -->
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="codebridge-editor">
    <div id="resizer-overlay"></div>
    <div id="container">
        <div id="blocklyArea">
            <div id="toolbar">
                <!-- 左側群組：平台與檔案 -->
                <div class="toolbar-group">
                    <div id="file-breadcrumb">
                        <img src="src/icons/load_project_24dp_1F1F1F.png" style="width: 14px; opacity: 0.5;">
                        <span id="current-filename">%{BKY_TLB_FILE_NEW}</span>
                    </div>
                    <div class="toolbar-btn" id="btn-examples" title="%{BKY_TLB_EXAMPLES}">
                        <img src="src/icons/examples_24dp_1F1F1F.png">
                    </div>
                    <div class="toolbar-separator"></div>
                    <div class="toolbar-btn" id="btn-new" title="%{BKY_TLB_NEW}">
                        <img src="src/icons/pen-new-square-outline.png">
                    </div>
                    <div class="toolbar-btn" id="btn-open" title="%{BKY_TLB_OPEN}">
                        <img src="src/icons/open-file.png">
                    </div>
                    <div class="toolbar-btn" id="btn-save" title="%{BKY_TLB_SAVE}">
                        <img src="src/icons/save.png">
                    </div>
                    <div class="toolbar-btn" id="btn-save-as" title="%{BKY_TLB_SAVE_AS}">
                        <img src="src/icons/save-as.png">
                    </div>
                    <div class="toolbar-separator"></div>
                    <div class="toolbar-dropdown">
                        <div class="toolbar-btn" id="btn-settings-root" title="%{BKY_TLB_SETTINGS}">
                            <img src="src/icons/settings_24dp_1F1F1F.png">
                        </div>
                        <div class="dropdown-content">
                            <div class="dropdown-item" id="btn-diagnose">
                                <img src="src/icons/module-puzzle-1.png" style="width: 16px; height: 16px; margin-right: 8px;">
                                <span>%{BKY_TLB_DIAGNOSE}</span>
                            </div>
                            <div class="dropdown-separator"></div>
                            <!-- 雙風格切換開關 (移入選單) -->
                            <div class="dropdown-item theme-toggle-menuitem" id="btn-theme-toggle" title="%{BKY_TLB_THEME_TOGGLE}">
                                <img src="src/icons/lego-duotone.png" style="width: 16px; height: 16px; margin-right: 8px;">
                                <span class="theme-text-label" id="themeTextLeft">Engineer</span>
                                <label class="switch" style="pointer-events: none;">
                                    <input type="checkbox" id="themeToggle">
                                    <span class="slider round"></span>
                                </label>
                                <span class="theme-text-label" id="themeTextRight">Angel</span>
                            </div>
                            <div class="dropdown-separator"></div>
                            <!-- 中英文語系切換開關 -->
                            <div class="dropdown-item theme-toggle-menuitem" id="btn-lang-toggle" title="%{BKY_TLB_LANG_TOGGLE}">
                                <img src="src/icons/i18n.png" style="width: 16px; height: 16px; margin-right: 8px;">
                                <span class="theme-text-label" id="langTextLeft">中文</span>
                                <label class="switch" style="pointer-events: none;">
                                    <input type="checkbox" id="langToggle">
                                    <span class="slider round"></span>
                                </label>
                                <span class="theme-text-label" id="langTextRight">EN</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="toolbar-flex-spacer"></div>

                <!-- 右側群組：Serial 與 執行 -->
                <div class="toolbar-group">
                    <div class="toolbar-btn" id="btn-refresh-serial" title="%{BKY_TLB_SERIAL_REFRESH}">
                        <img src="src/icons/connect_serial_24dp_1F1F1F.png">
                    </div>
                    <select id="serial-selector" class="serial-select" title="%{BKY_TLB_SERIAL_PORT}">
                        <option value="">%{BKY_TLB_NO_PORT}</option>
                    </select>
                    <div class="toolbar-separator"></div>
                    <div class="toolbar-btn" id="btn-run" title="%{BKY_TLB_RUN}">
                        <img src="src/icons/run_blocks_24dp_75FB4C.png">
                    </div>
                    <div class="toolbar-btn" id="btn-stop" title="%{BKY_TLB_STOP_PROGRAM}">
                        <img src="src/icons/stop_24dp_EA3323.png">
                    </div>
                    <div class="toolbar-btn" id="btn-terminal" title="%{BKY_TLB_TERMINAL}">
                        <img src="src/icons/terminal_24dp_1F1F1F.png">
                    </div>
                </div>
            </div>
    <!-- Toolbox XML (隱藏) - 對齊 piBlockly 結構，使用 %{BKY_...} 佔位符 -->
    <xml id="toolbox-xml" style="display: none;">
        <!-- Arduino 主分類 -->
        <category name="%{BKY_ARDUINO_CATEGORY}" colour="#016c8d">
            <!-- 結構 -->
            <category name="%{BKY_ARDUINO_STRUCTURE_CATEGORY}" colour="#585858">
                <block type="initializes_setup"></block>
                <block type="initializes_loop"></block>
            </category>
            <!-- I/O -->
            <category name="%{BKY_ARDUINO_IO_CATEGORY}" colour="#016c8d">
                <block type="arduino_pin_mode">
                    <value name="PIN">
                        <shadow type="arduino_pin_shadow">
                            <field name="PIN"></field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_digital_read">
                    <value name="PIN">
                        <shadow type="arduino_pin_shadow">
                            <field name="PIN"></field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_digital_write">
                    <value name="PIN">
                        <shadow type="arduino_pin_shadow">
                            <field name="PIN"></field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_analog_read">
                    <value name="PIN">
                        <shadow type="arduino_pin_shadow">
                            <field name="PIN">A0</field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_analog_write">
                    <value name="PIN">
                        <shadow type="arduino_pin_shadow">
                            <field name="PIN">~</field>
                        </shadow>
                    </value>
                    <value name="VALUE">
                        <shadow type="math_number">
                            <field name="NUM">0</field>
                        </shadow>
                    </value>
                </block>
            </category>
            <!-- 時間 -->
            <category name="%{BKY_ARDUINO_TIME_CATEGORY}" colour="#1f039b">
                <block type="arduino_delay">
                    <value name="TIME">
                        <shadow type="math_number">
                            <field name="NUM">1000</field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_delay_microseconds">
                    <value name="TIME">
                        <shadow type="math_number">
                            <field name="NUM">1000</field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_millis"></block>
                <block type="arduino_micros"></block>
            </category>
            <!-- 序列埠 -->
            <category name="%{BKY_ARDUINO_SERIAL_CATEGORY}" colour="#359AFF">
                <block type="arduino_serial_begin"></block>
                <block type="arduino_serial_print">
                    <value name="VALUE">
                        <shadow type="text">
                            <field name="TEXT">Hello, World!</field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_serial_println">
                    <value name="VALUE">
                        <shadow type="text">
                            <field name="TEXT">Hello, World!</field>
                        </shadow>
                    </value>
                </block>
                <block type="arduino_serial_available"></block>
                <block type="arduino_serial_read"></block>
            </category>
        </category>
        <!-- Coding -->
        <category name="%{BKY_CODING_CATEGORY}" colour="#585858">
            <block type="coding_comment"></block>
            <block type="coding_include"></block>
            <block type="coding_raw_statement"></block>
            <block type="coding_raw_input"></block>
            <block type="coding_raw_definition"></block>
            <block type="coding_raw_wrapper"></block>
        </category>
        <sep></sep>
        <!-- 邏輯 -->
        <category name="%{BKY_LOGIC_CATEGORY}" colour="#b198de">
            <block type="controls_if"></block>
            <block type="logic_compare"></block>
            <block type="logic_operation"></block>
            <block type="logic_negate"></block>
            <block type="logic_boolean"></block>
        </category>
        <!-- 迴圈 -->
        <category name="%{BKY_LOOPS_CATEGORY}" colour="#7fcd81">
            <block type="controls_while"></block>
            <block type="controls_for">
                <value name="FROM">
                    <shadow type="math_number">
                        <field name="NUM">1</field>
                    </shadow>
                </value>
                <value name="TO">
                    <shadow type="math_number">
                        <field name="NUM">10</field>
                    </shadow>
                </value>
                <value name="BY">
                    <shadow type="math_number">
                        <field name="NUM">1</field>
                    </shadow>
                </value>
            </block>
            <block type="controls_flow_statements"></block>
        </category>
        <!-- 數學 -->
        <category name="%{BKY_MATH_CATEGORY}" colour="#5C68A6">
            <block type="math_number"></block>
            <block type="math_arithmetic"></block>
            <block type="math_single"></block>
            <block type="arduino_constrain">
                <value name="LOW">
                    <shadow type="math_number">
                        <field name="NUM">0</field>
                    </shadow>
                </value>
                <value name="HIGH">
                    <shadow type="math_number">
                        <field name="NUM">255</field>
                    </shadow>
                </value>
            </block>
            <block type="arduino_map">
                <value name="FROMLOW">
                    <shadow type="math_number">
                        <field name="NUM">0</field>
                    </shadow>
                </value>
                <value name="FROMHIGH">
                    <shadow type="math_number">
                        <field name="NUM">1023</field>
                    </shadow>
                </value>
                <value name="TOLOW">
                    <shadow type="math_number">
                        <field name="NUM">0</field>
                    </shadow>
                </value>
                <value name="TOHIGH">
                    <shadow type="math_number">
                        <field name="NUM">255</field>
                    </shadow>
                </value>
            </block>
            <block type="arduino_math_random_seed">
                <value name="SEED">
                    <shadow type="arduino_analog_read">
                        <value name="PIN">
                            <shadow type="arduino_pin_shadow">
                                <field name="PIN">A0</field>
                            </shadow>
                        </value>
                    </shadow>
                </value>
            </block>
            <block type="arduino_math_random_int">
                <value name="MIN">
                    <shadow type="math_number">
                        <field name="NUM">0</field>
                    </shadow>
                </value>
                <value name="MAX">
                    <shadow type="math_number">
                        <field name="NUM">100</field>
                    </shadow>
                </value>
            </block>
        </category>
        <!-- 文字 -->
        <category name="%{BKY_TEXT_CATEGORY}" colour="#6a8871">
            <block type="text"></block>
            <block type="text_join"></block>
            <block type="text_append">
                <value name="TEXT">
                    <shadow type="text"></shadow>
                </value>
            </block>
            <block type="text_length"></block>
        </category>
        <sep></sep>
        <!-- 變數 -->
        <category name="%{BKY_VARIABLES_CATEGORY}" colour="#ef9a9a" custom="VARIABLE"></category>
        <!-- 陣列 -->
        <category name="%{BKY_ARRAY_CATEGORY}" colour="#d1972b">
            <block type="array_declare_global">
                <value name="SIZE">
                    <shadow type="math_number">
                        <field name="NUM">10</field>
                    </shadow>
                </value>
            </block>
            <block type="array_declare_local">
                <value name="SIZE">
                    <shadow type="math_number">
                        <field name="NUM">10</field>
                    </shadow>
                </value>
            </block>
            <block type="array_get">
                <value name="INDEX">
                    <shadow type="math_number">
                        <field name="NUM">0</field>
                    </shadow>
                </value>
            </block>
            <block type="array_set">
                <value name="INDEX">
                    <shadow type="math_number">
                        <field name="NUM">0</field>
                    </shadow>
                </value>
            </block>
            <block type="array_length"></block>
        </category>
        <!-- 函式 -->
        <category name="%{BKY_FUNCTIONS_CATEGORY}" colour="#d22f73">
            <block type="custom_functions_defnoreturn"></block>
            <block type="custom_functions_defreturn"></block>
            <block type="custom_functions_return"></block>
            <block type="custom_functions_callnoreturn_manual"></block>
            <block type="custom_functions_callreturn_manual"></block>
        </category>
    </xml>
    
    <div id="blocklyDiv"></div>
    <!-- 整合式終端機面板 -->
            <div id="terminalArea" class="collapsed">
                <div id="terminalHeader">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <img src="src/icons/terminal_24dp_FE2F89.png" style="width: 14px;">
                        <span id="terminalTitle">%{BKY_TLB_TERMINAL_TITLE}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button class="terminal-tool-btn" id="btn-pause-terminal" title="%{BKY_TLB_PAUSE_SCROLL}">
                            <img src="src/icons/list_arrow_24dp_FE2F89.png" style="width: 16px; height: 16px; opacity: 0.8;">
                        </button>
                        <button class="terminal-tool-btn" id="btn-clear-terminal" title="%{BKY_TLB_CLEAR_CONSOLE}">
                            <img src="src/icons/brush-3-ai-line_ff007c.png" style="width: 16px; height: 16px;">
                        </button>
                        <button class="terminal-tool-btn" id="btn-close-terminal" title="%{BKY_TLB_CLOSE_PANEL}">
                            <span style="font-size: 16px; font-weight: bold;">×</span>
                        </button>
                    </div>
                </div>
                <div id="terminalContent"></div>
            </div>
        </div>
        <div id="panel-resizer" title="%{BKY_TLB_DRAG_RESIZE}"></div>
        <div id="codeArea">
            <div id="code-toggle" title="%{BKY_TLB_TOGGLE_CODE}">
                <span class="arrow">▶</span>
            </div>
            <div id="codeHeader">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="toolbar-btn" id="btn-close-code" title="%{BKY_TLB_CLOSE_PANEL}" style="margin-right: 4px;">
                        <span class="close-icon">×</span>
                    </div>
                    <span>%{BKY_TLB_ARDUINO_PREVIEW}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="toolbar-btn" id="btn-copy-code" title="%{BKY_TLB_COPY_CODE}" style="width: 24px; height: 24px;">
                        <img src="src/icons/copy-duotone.png" style="width: 18px; height: 18px;">
                    </div>
                </div>
            </div>
            <div id="codeContent"></div>
        </div>
    </div>

    <!-- Blockly 核心 -->
    <script src="blockly/core/blockly.js"></script>
    <script src="blockly/core/python_compressed.js"></script>

    <!-- 插件 -->
    <script src="blockly/plugins/field-colour.js"></script>
    <script src="blockly/plugins/field-multilineinput.js"></script>
    <script src="blockly/plugins/scroll-options.js"></script>
    <script src="blockly/plugins/workspace-minimap.js"></script>
    <script src="blockly/plugins/blockly-modal.js"></script>

    <!-- ====== 積木模組載入 ====== -->

    <!-- Arduino Generator 核心（必須在 generators 之前載入） -->
    <script src="src/lib/blockly/generators/_core.js"></script>

    <!-- Arduino 模組：i18n → blocks → generators -->
    <script src="src/lib/blockly/modules/arduino/zh-hant.js"></script>
    <script src="src/lib/blockly/modules/arduino/en.js"></script>
    <script src="src/lib/blockly/modules/arduino/blocks.js"></script>
    <script src="src/lib/blockly/modules/arduino/generators.js"></script>

    <!-- 共用分類名稱（尚未有專屬模組的分類） -->
    <script src="src/lib/blockly/modules/common/zh-hant.js"></script>
    <script src="src/lib/blockly/modules/common/en.js"></script>

    <!-- Engineer 風格覆寫（跨模組） -->
    <script src="src/lib/blockly/style/engineer.js"></script>

    <!-- 模組載入器（根據語系註冊 i18n 到 Blockly.Msg） -->
    <script src="src/lib/blockly/loader.js"></script>

    <!-- ====== UI i18n ====== -->

    <!-- UI 翻譯資料 -->
    <script src="src/lib/i18n/zh-hant.js"></script>
    <script src="src/lib/i18n/en.js"></script>

    <!-- i18n 膠水層（語系偵測、DOM 替換） -->
    <script src="src/i18n.js"></script>

    <!-- ====== 主程式 ====== -->

    <!-- 主程式核心邏輯 -->
    <script src="src/main.js"></script>
</body>
</html>
