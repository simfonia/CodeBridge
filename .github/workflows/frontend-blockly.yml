name: Frontend Blockly contract

# 2026-09-30 事故記錄（run #12 紅燈，根因已修）：
#   CI 原本寫 node-version: 24（浮動）。隨著 Node 24 內附 npm 升版，npm ci 的
#   lock 驗證邏輯變嚴，判定 @emnapi/core@1.11.3 / @emnapi/runtime@1.11.3「不在 lock 中」
#   （舊 lock 只有 @rolldown/binding-wasm32-wasi 底下的巢狀 1.11.1）→ EUSAGE 直接 exit 1。
#   已用新版 npm 重建 lock（補上頂層 1.11.3），npm 11.6.2 與 11.19.1 皆驗證通過。
#   ⚠️ 往後改動依賴後，務必用「將會在 CI 執行的 npm 版本」重建並提交 lock。
#      本機驗證指令：npx -y npm@<版本> ci --dry-run（在含 package.json + lock 的目錄）。
"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 2026-10-03：行尾一致性守門。
  # 為什麼獨立成一個 job（不併入 unit）：
  #   行尾問題與邏輯錯誤無關，混在一起會讓「紅燈原因」難以辨識（unit 秒紅時
  #   到底是邏輯壞掉還是有人存檔存成 LF？）。獨立 job 讓兩者一眼可分。
  #
  # 為什麼只在 windows-latest 跑：
  #   本專案的行尾基準是 CRLF，而 windows-latest 的 core.autocrlf=true 會把
  #   checkout 轉成 CRLF —— 與開發環境一致。在 macOS/Linux 跑會因平台慣例是 LF
  #   而全數報紅（假紅燈），故不加入矩陣。
  #
  # 本 job 不需要安裝前端依賴（scripts/eol.mjs 只用 Node 內建模組）。
  eol:
    name: Line endings (CRLF)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 檢查工作區文字檔的行尾。工具內建自我交叉驗證：
      # 會以 git ls-files --eol 比對，漏掃的檔案會一併報出（不會自以為全綠）。
      - name: Check line endings
        run: npm run eol:check

  # 2026-09-30：由單一 job 拆為兩階段（決策點 1）。
  # unit 先跑（約 4 秒／261 例），失敗時立刻知道是邏輯層問題，不必等 E2E 跑完。
  # blockly-contract 以 needs: unit 串接，兩者皆為阻塞式：任一紅燈即整體失敗。
  unit:
    name: Frontend unit tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      # 2026-09-30 CB-T1：261 個 Vitest 單元測試原本不在 CI 任何一步，形同不存在。
      - name: Run frontend unit tests
        run: npm run test:unit --prefix ui

  blockly-contract:
    name: Frontend Blockly contract
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Validate Blockly assets
        run: npm run test:blockly:assets --prefix ui

      - name: Run Blockly runtime and migration contracts
        run: npm run test:e2e --prefix ui

      - name: Build frontend
        run: npm run build --prefix ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
