name: Frontend Blockly contract

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blockly-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Validate Blockly assets
        run: npm run test:blockly:assets --prefix ui

      - name: Run Blockly runtime and migration contracts
        run: npm run test:blockly --prefix ui

      - name: Build frontend
        run: npm run build --prefix ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
